<div class="container" *ngIf="!listaVacia">
  <h1>Lista de productos</h1>
  <table class="table table-dark">
    <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Nombre</th>
        <th scope="col">Precio</th>
        <th scope="col">Ver</th>
        <th scope="col">Editar</th>
        <th scope="col">Borrar</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let producto of productos">
        <td>{{ producto.id }}</td>
        <td>{{ producto.nombre }}</td>
        <td>${{ producto.precio }}</td>
        <td><button class="btn btn-outline-primary" [routerLink]="['/detalle', producto.id]">Ver</button></td>
        <td><button class="btn btn-outline-warning" [routerLink]="['/editar', producto.id]">Editar</button></td>
        <button class="btn btn-outline-danger" (click)="borrar(producto.id ? producto.id : 0)">
          Borrar
        </button>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button class="btn btn-primary" (click)="anterior()" [disabled]="page === 1">Anterior</button>

    <!-- Rango de páginas -->
    <ng-container *ngFor="let p of getPaginaRango()">
      <button class="btn btn-outline-primary" (click)="cambiarPagina(p)" [class.active]="p === page">{{ p }}</button>
    </ng-container>

    <span>Página {{ page }} de {{ lastPage }}</span>
    <button class="btn btn-primary" (click)="siguiente()" [disabled]="page === lastPage">Siguiente</button>
  </div>
</div>

<div class="container" *ngIf="listaVacia" style="text-align: center;">
  <h3>No hay productos para mostrar</h3>
  <h4><a class="nav-link" routerLink="/nuevo"><i class="fas fa-plus-circle"></i> Nuevo Producto</a></h4>
</div>
